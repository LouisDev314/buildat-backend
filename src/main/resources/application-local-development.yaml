# Activate ONLY after project/history/grants verification and exact hosted SQL review.
server:
  address: 127.0.0.1
spring:
  flyway:
    enabled: ${BUILDAT_LOCAL_MIGRATIONS_APPROVED:false}
    url: ${MIGRATION_DATABASE_URL}
    user: ${MIGRATION_DATABASE_USERNAME}
    password: ${MIGRATION_DATABASE_PASSWORD}
    default-schema: ${FLYWAY_HISTORY_SCHEMA}
    create-schemas: false
buildat:
  docs:
    enabled: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
