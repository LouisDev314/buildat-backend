spring:
  application:
    name: buildat-server
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:5}
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Default/deployment runtimes never migrate. Local activation requires the reviewed setup gate.
    enabled: false
    clean-disabled: true
    baseline-on-migrate: false

management:
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# No project defaults: a missing or inconsistent Auth configuration fails startup.
buildat:
  auth:
    project-url: ${SUPABASE_URL}
    issuer: ${SUPABASE_ISSUER}
    jwks-uri: ${SUPABASE_JWKS_URI}
    audience: authenticated
    signing-algorithms:
      - ES256
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY}
  docs:
    enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: false
  ai:
    mcp:
      enabled: false
